name: host-only
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Host-only reference tests (not QNX native)
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Portable C core (host only, not QNX)
        run: |
          mkdir -p .local
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icore core/transport.c core/protocol.c tests/test_core.c -o .local/test-core
          .local/test-core
      - name: Syntax and whitespace
        run: |
          python3 -m compileall -q src tests tools
          sh -n tools/run-native-readonly.sh
          python3 tools/run-native-readonly.py --help >/dev/null
          sh -n tools/run-native-suite.sh
          python3 tools/run-native-suite.py --help >/dev/null
          git diff --check
